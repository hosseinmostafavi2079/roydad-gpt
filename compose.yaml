services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventos_container_admin
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Copy .env.example to .env and set local secrets}
      POSTGRES_DB: eventos_control
      CONTROL_APP_PASSWORD: ${CONTROL_APP_PASSWORD:?Set CONTROL_APP_PASSWORD}
      CONTROL_MIGRATION_PASSWORD: ${CONTROL_MIGRATION_PASSWORD:?Set CONTROL_MIGRATION_PASSWORD}
      CONTROL_QUEUE_PASSWORD: ${CONTROL_QUEUE_PASSWORD:?Set CONTROL_QUEUE_PASSWORD}
      TENANT_PROVISIONER_PASSWORD: ${TENANT_PROVISIONER_PASSWORD:?Set TENANT_PROVISIONER_PASSWORD}
      TENANT_RUNTIME_PASSWORD: ${TENANT_RUNTIME_PASSWORD:?Set TENANT_RUNTIME_PASSWORD}
      TENANT_MIGRATION_PASSWORD: ${TENANT_MIGRATION_PASSWORD:?Set TENANT_MIGRATION_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - eventos-postgres:/var/lib/postgresql
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/010-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos_container_admin -d eventos_control"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  storage:
    image: adobe/s3mock:5.1.0
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${MEDIA_S3_BUCKET:-eventos-local-media}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:59000:9090"
    volumes:
      - eventos-s3mock:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    image: eventos-local:latest
    profiles: ["application"]
    restart: unless-stopped
    env_file:
      - .env.local-runtime
    environment:
      NODE_ENV: production
      PLATFORM_REQUIRE_MFA: ${PLATFORM_REQUIRE_MFA:-false}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - local-media:/app/data/media
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  worker:
    image: eventos-local:latest
    profiles: ["application"]
    restart: unless-stopped
    command: ["node", "--conditions=react-server", "--import=tsx", "scripts/provisioning-worker.ts"]
    env_file:
      - .env.local-runtime
    environment:
      NODE_ENV: production
      PLATFORM_REQUIRE_MFA: ${PLATFORM_REQUIRE_MFA:-false}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  payment-worker:
    image: eventos-local:latest
    profiles: ["application"]
    restart: unless-stopped
    command: ["node", "--conditions=react-server", "--import=tsx", "scripts/payment-maintenance-worker.ts"]
    env_file:
      - .env.local-runtime
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  eventos-postgres:
  eventos-s3mock:
  local-media:
    name: roydad_eventos-local-media
